name: janus

services:

  untrusted_pc1:
    image: alpine:latest
    networks:
      - untrusted_network
    command: sh -c 'ip route del default && ip route add default via 192.168.0.254 && sleep infinity'
    cap_add:
      - NET_ADMIN
  untrusted_pc2:
    image: alpine:latest
    networks:
      - untrusted_network
    command: sh -c 'ip route del default && ip route add default via 192.168.0.254 && sleep infinity'
    cap_add:
      - NET_ADMIN

  trusted_pc:
    image: alpine:latest
    networks:
      - trusted_network
    command: sh -c 'ip route del default && ip route add default via 192.168.1.254 && sleep infinity'

    cap_add:
      - NET_ADMIN

  janus_core:
    build: .
    networks:
      trusted_network:
        ipv4_address: 192.168.1.254
      untrusted_network:
        ipv4_address: 192.168.0.254
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9443:9443"
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  untrusted_network:
    driver: bridge
    #internal: true
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1

  trusted_network:
    driver: bridge
    #internal: true
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

volumes:
  data:


