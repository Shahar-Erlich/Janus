networks:
  untrusted_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24

  trusted_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
  server_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
volumes:
  pgdata:


